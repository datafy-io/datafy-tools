name: Build Go Binary

on:
  push:
    branches: [main]
    paths:
      - "scoping-tool/golang/**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "scoping-tool/golang/**"

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scoping-tool/golang/go.mod
          cache-dependency-path: scoping-tool/golang/go.sum

      - name: Download modules
        working-directory: scoping-tool/golang
        run: go mod tidy

      - name: Build
        working-directory: scoping-tool/golang
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BIN=discovery-${{ matrix.goos }}-${{ matrix.goarch }}
          [ "${{ matrix.goos }}" = "windows" ] && BIN="${BIN}.exe"
          go build -ldflags="-s -w" -o "${BIN}" .

      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ matrix.goos }}-${{ matrix.goarch }}
          path: scoping-tool/golang/discovery-*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/discovery-*
          generate_release_notes: true
          body: |
            ## Datafy Discovery Tool ${{ github.ref_name }}

            Inventories EBS volumes, EC2 instances, AMIs, snapshots, DLM policies, and AWS Backup plans across all accounts in an AWS Organization. Output is one JSON object per account × region (JSONL format).

            ## Download

            | Platform | Binary |
            |----------|--------|
            | Linux x86-64 | `discovery-linux-amd64` |
            | Linux ARM64 | `discovery-linux-arm64` |
            | macOS x86-64 | `discovery-darwin-amd64` |
            | macOS Apple Silicon | `discovery-darwin-arm64` |
            | Windows x86-64 | `discovery-windows-amd64.exe` |

            ## Quick start

            ```bash
            # Scan all accounts in the org
            ./discovery -profile myprofile

            # Deploy a minimal read-only role via StackSet, scan, then auto-teardown
            ./discovery -profile myprofile -setup-role

            # Scan a specific OU
            ./discovery -profile myprofile -ou ou-ab12-xxxxxxxx
            ```

            See the [README](https://github.com/datafy-io/datafy-tools/blob/main/scoping-tool/golang/README.md) for full usage.
