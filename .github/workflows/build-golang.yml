name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "discovery-tool/**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "discovery-tool/**"

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: discovery-tool/aws/golang/go.mod
          cache-dependency-path: discovery-tool/aws/golang/go.sum

      - name: Download modules
        working-directory: discovery-tool/aws/golang
        run: go mod tidy

      - name: Build
        working-directory: discovery-tool/aws/golang
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BIN=discovery-${{ matrix.goos }}-${{ matrix.goarch }}
          [ "${{ matrix.goos }}" = "windows" ] && BIN="${BIN}.exe"
          go build -ldflags="-s -w" -o "${BIN}" .

      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ matrix.goos }}-${{ matrix.goarch }}
          path: discovery-tool/aws/golang/discovery-*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release assets
        run: |
          cp discovery-tool/aws/bash/discovery.sh    artifacts/discovery.sh
          cp discovery-tool/aws/python/discovery.py  artifacts/discovery.py

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/discovery-*
            artifacts/discovery.sh
            artifacts/discovery.py
          generate_release_notes: true
          body: |
            ## Datafy Discovery Tool ${{ github.ref_name }}

            Inventories EBS volumes, EC2 instances, AMIs, snapshots, DLM policies, and AWS Backup plans across all accounts in an AWS Organization. Output is one JSON object per account × region (JSONL format).

            ## Download

            | Tool | File | Requirements |
            |------|------|--------------|
            | Go — Linux x86-64 | `discovery-linux-amd64` | none |
            | Go — Linux ARM64 | `discovery-linux-arm64` | none |
            | Go — macOS x86-64 | `discovery-darwin-amd64` | none |
            | Go — macOS Apple Silicon | `discovery-darwin-arm64` | none |
            | Go — Windows x86-64 | `discovery-windows-amd64.exe` | none |
            | Bash | `discovery.sh` | aws-cli v2, jq |
            | Python | `discovery.py` | Python 3.8+, boto3 |

            ## Quick start

            ```bash
            # Go
            ./discovery-darwin-arm64 --profile myprofile --setup-role

            # Bash
            chmod +x discovery.sh
            ./discovery.sh --profile myprofile --setup-role

            # Python
            pip install boto3
            python3 discovery.py --profile myprofile --setup-role
            ```

            See the [README](https://github.com/datafy-io/datafy-tools/blob/main/discovery-tool/README.md) for full usage.
